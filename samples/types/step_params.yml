- name: StepParams
  type: record
  doc: |
    Everything one StepChain step needs to run one job.
    The first group comes from the request (same for every job); the second
    group comes from the job splitter (differs per job). Generate it with
    cwl/scripts/make_job_inputs.py from request.json + jobN.json.
  fields:
    # --- Per request (from request.json and the PSets) ---
    - name: cmssw_version
      type: string
      doc: CMSSW release, e.g. CMSSW_10_6_47.
    - name: scram_arch
      type: string
      doc: SCRAM architecture, e.g. slc7_amd64_gcc700.
    - name: pset
      type: File
      doc: Base PSet of the step (PSets/PSet_cmsRunN_*.py).
    - name: output_module
      type: string
      doc: >
        Output module whose file is passed to the next step (or kept, for the
        last steps). It is written as <output_module>.root.
    - name: memory_mb
      type: int
      doc: Memory for cmsRun, in MB (request Memory).
    # --- Per job (from the job splitter) ---
    - name: number_of_threads
      type: int
      doc: process.options.numberOfThreads.
    - name: number_of_streams
      type: int
      doc: process.options.numberOfStreams (0 = CMSSW default).
    - name: max_events
      type: int
      doc: process.maxEvents.input (-1 = all events of the input file).
    - name: first_event
      type: long?
      doc: process.source.firstEvent.
    - name: first_lumi
      type: int?
      doc: process.source.firstLuminosityBlock.
    - name: first_run
      type: int?
      doc: process.source.firstRun.
